[project]
name = "ecoroute"
version = "0.1.0"
description = "Deterministic carbon-aware MCP router for LLM inference workloads"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
ecoroute = "ecoroute.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ecoroute"]

[tool.setuptools.package-data]
ecoroute = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
